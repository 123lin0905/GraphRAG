# =====================================================================
# 三星堆文物数字孪生与智能导览系统 —— 主配置
# 敏感配置均支持通过环境变量覆盖，如 DB_PASSWORD、LLM_API_KEY、JWT_SECRET
# =====================================================================
server:
  port: ${SERVER_PORT:8080}
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: sanxingdui-twin
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:sanxingdui_twin}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root123}
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: always
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB
  mvc:
    async:
      # SSE 流式问答的最长保持时间（毫秒）
      request-timeout: 180000

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.sanxingdui.twin.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ---------------- JWT 配置 ----------------
jwt:
  # 签名密钥（HS256，至少32字节），生产环境务必通过环境变量 JWT_SECRET 覆盖
  secret: ${JWT_SECRET:sanxingdui-digital-twin-graphrag-jwt-secret-key-2026}
  # 令牌有效期（小时）
  expire-hours: 24
  header: Authorization
  prefix: "Bearer "

# ---------------- 大模型（OpenAI 兼容接口）配置 ----------------
# 优先读取数据库 system_config 表中的 llm.* 配置，为空时回落到此处
llm:
  base-url: ${LLM_BASE_URL:https://api.deepseek.com}
  api-key: ${LLM_API_KEY:}
  model: ${LLM_MODEL:deepseek-chat}
  temperature: 0.3
  max-tokens: 1024
  connect-timeout-seconds: 10
  read-timeout-seconds: 90

# ---------------- GraphRAG 检索参数 ----------------
rag:
  max-hops: 2
  max-triples: 40
  max-literature: 3
  max-artifacts: 4
  history-turns: 3

# ---------------- 接口文档 ----------------
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: default
      paths-to-match: /api/**
      packages-to-scan: com.sanxingdui.twin.controller
knife4j:
  enable: true
  setting:
    language: zh_cn

logging:
  level:
    root: info
    com.sanxingdui.twin: debug
